[package]
name = "mazecat"
version = "0.1.1"
description = "A small focus helper: your task list and a timer that floats over the taskbar."
authors = ["Brian Thorne"]
license = "MIT"
edition = "2021"

[lib]
name = "mazecat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
