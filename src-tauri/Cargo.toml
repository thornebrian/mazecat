[package]
name = "mazecat"
version = "0.1.1"
description = "A small focus helper: your task list and a timer that floats over the taskbar."
authors = ["Brian Thorne"]
license = "MIT"
edition = "2021"

[lib]
name = "mazecat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
