<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Maze Cat</title>
<link rel="stylesheet" href="/src/style.css">
<style>
  body { background: transparent; overflow: hidden; }
  .bar { height: 100vh; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 4px;
         background: rgba(21, 24, 30, .92); border: 1px solid var(--line); border-radius: 10px; }
  .catbtn { flex: none; width: 30px; height: 30px; padding: 3px; border: 0; border-radius: 8px; background: transparent; }
  .catbtn:hover { background: var(--panel); }
  .catbtn:focus:not(:focus-visible) { outline: none; }
  .cat { width: 100%; height: 100%; display: block; }
  .cat.awake { --cat: var(--accent); }
  .task { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: grab; user-select: none; }
  .task.idle { color: var(--muted); }
  .clock { flex: none; min-width: 64px; padding: 4px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel);
           font: 600 14px/1 var(--mono); font-variant-numeric: tabular-nums; text-align: center; }
  .clock.running { color: var(--accent); border-color: var(--accent); }
  .clock.paused { color: var(--muted); }
  .clock.up { color: var(--bg); background: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<div class="bar">
  <button class="catbtn" id="cat" type="button" aria-label="Show or hide your lists"></button>
  <div class="task idle" id="task" data-tauri-drag-region>Pick a task in your lists</div>
  <button class="clock" id="clock" type="button" aria-label="Pause or resume the timer">--:--</button>
</div>
<script type="module" src="/src/bar.ts"></script>
</body>
</html>
