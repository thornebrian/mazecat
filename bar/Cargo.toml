[package]
name = "mazecat-bar"
version = "0.1.1"
description = "Maze Cat's bar: the cat, your task and the timer, drawn natively so it can sit on the taskbar."
authors = ["Brian Thorne"]
license = "MIT"
edition = "2021"

# Its own crate, so only this small program gets the "above the taskbar" (uiAccess) manifest.
[workspace]

[dependencies]
serde_json = "1"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Media_Audio",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
